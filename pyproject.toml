[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tubric-qa"
version = "0.1.0"
description = "Portable, review-first BIDS and MRIQC cohort quality reports"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Temple University Neuroeconomics Lab"}]
dependencies = ["pybids>=0.22,<0.23", "numpy>=1.26,<3", "matplotlib>=3.10,<4", "nibabel>=5.3,<6"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.14,<0.15", "build>=1.3,<2"]

[project.scripts]
tubric-qa = "tubric_qa.cli:main"

[project.urls]
Repository = "https://github.com/DVS-Lab/tubric-qa"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
